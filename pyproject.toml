[project]
name = "any2book-processors"
version = "0.2.1"
description = "Document processors for the Any2Book agent skill"
requires-python = ">=3.11"
dependencies = [
  "defusedxml>=0.7.1",
  "idna>=3.10",
  "pymupdf>=1.24.0",
  "pymupdf4llm>=1.28.2",
  "tree-sitter>=0.25.0",
  "tree-sitter-javascript>=0.25.0",
]

[project.scripts]
any2book-backend = "any2book_processors.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/any2book_processors"]

[dependency-groups]
dev = [
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "ruff>=0.8.0",
  "types-defusedxml>=0.7.0.20250822",
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["python/any2book_processors"]

[[tool.mypy.overrides]]
module = "any2book_processors.adapters"
disallow_untyped_calls = false
